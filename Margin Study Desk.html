<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Margin Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar + workspace on desktop; top bar + bottom tabs on phones. Index-card ruling and a highlighter swash are the two recurring motifs. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --bg:#EDF0F6;--surface:#FFFFFF;--surface2:#F5F7FB;--line:#D8DEEA;--line2:#E8ECF4;
  --ink:#0F1B33;--muted:#586480;--accent:#2F4FEA;--accent-ink:#FFFFFF;--accent-soft:#E2E8FF;
  --mark:#FFE35A;--mark-ink:#241F00;
  --good:#13803F;--good-soft:#DDF3E5;--warn:#A8530A;--warn-soft:#FDEBD3;--bad:#C0292B;--bad-soft:#FBE0E0;
  --c0:#3558F2;--c1:#0F9D8A;--c2:#E2630D;--c3:#D6336C;--c4:#7048E8;--c5:#3B9A1F;
  --heat0:#E3E8F2;--heat1:#C3D2FF;--heat2:#92AAFF;--heat3:#5877F5;--heat4:#2F4FEA;
  --ruled:#DCE6F7;--margin-line:#F4B3B3;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111B;--surface:#141A27;--surface2:#1A2133;--line:#2A3349;--line2:#222B3F;
  --ink:#E8ECF6;--muted:#97A3BF;--accent:#8AA2FF;--accent-ink:#0A1024;--accent-soft:#1D2750;
  --mark:#E8CE3B;--mark-ink:#1E1A00;
  --good:#4CD97F;--good-soft:#14301F;--warn:#F2A25C;--warn-soft:#3A2713;--bad:#FF7F82;--bad-soft:#3B181A;
  --c0:#86A0FF;--c1:#3FD0BA;--c2:#FF9A52;--c3:#FF7AA8;--c4:#A98BFF;--c5:#86D86A;
  --heat0:#1C2436;--heat1:#26356E;--heat2:#3A52B0;--heat3:#5E7BEA;--heat4:#8AA2FF;
  --ruled:#222E48;--margin-line:#6E3340;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111B;--surface:#141A27;--surface2:#1A2133;--line:#2A3349;--line2:#222B3F;
  --ink:#E8ECF6;--muted:#97A3BF;--accent:#8AA2FF;--accent-ink:#0A1024;--accent-soft:#1D2750;
  --mark:#E8CE3B;--mark-ink:#1E1A00;
  --good:#4CD97F;--good-soft:#14301F;--warn:#F2A25C;--warn-soft:#3A2713;--bad:#FF7F82;--bad-soft:#3B181A;
  --c0:#86A0FF;--c1:#3FD0BA;--c2:#FF9A52;--c3:#FF7AA8;--c4:#A98BFF;--c5:#86D86A;
  --heat0:#1C2436;--heat1:#26356E;--heat2:#3A52B0;--heat3:#5E7BEA;--heat4:#8AA2FF;
  --ruled:#222E48;--margin-line:#6E3340;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:34px;font-weight:700}h2{font-size:21px;font-weight:700}h3{font-size:16.5px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 94%,transparent 94%);padding:0 .12em;margin:0 -.12em}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.tight{gap:6px}.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;max-width:1320px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));padding:22px 0;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;position:relative}
.brand i::after{content:"";width:12px;height:3px;background:var(--mark);border-radius:2px;display:block;box-shadow:0 -5px 0 rgba(255,255,255,.55),0 5px 0 rgba(255,255,255,.55)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav h4{font-family:var(--font-body);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:14px 10px 4px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.nav button[aria-current="page"] .ic{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.top{display:none}
.main{padding:26px 0 56px;min-width:0}
.tabs{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dc,var(--accent));flex:none}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span{letter-spacing:.01em}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph p{margin-top:6px;color:var(--muted)}
.sec{margin-top:26px}.sec>.row{margin-bottom:12px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:28px;line-height:1.05}
.stat span{font-size:12.5px;color:var(--muted)}
/* today */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:16px}
.cta{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.cta .big{font-family:var(--font-display);font-size:46px;font-weight:700;line-height:1}
.cta .btn{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:19px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:transparent;padding:0}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done-t{text-decoration:line-through;color:var(--muted)}
/* decks */
.deck{display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--dc)}
.deck h3{overflow-wrap:anywhere}
.counts{display:flex;gap:14px}
.counts div{display:flex;flex-direction:column}
.counts b{font-family:var(--font-display);font-size:22px;line-height:1}
.counts span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* index card */
.stage{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.flip{perspective:1400px}
.flip .inner{position:relative;min-height:300px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:62px 28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;
  background-image:linear-gradient(to bottom,transparent 44px,var(--margin-line) 44px,var(--margin-line) 46px,transparent 46px),repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--ruled) 29px,var(--ruled) 30px);background-position:0 0,0 14px}
.face.back{transform:rotateY(180deg);border-top:4px solid var(--dc,var(--accent))}
.face .tag{position:absolute;top:12px;left:16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.face .txt{font-family:var(--font-display);font-size:25px;font-weight:500;line-height:1.3;overflow-wrap:anywhere;max-width:100%;background:var(--surface);padding:2px 10px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grades button{display:flex;flex-direction:column;gap:2px;align-items:center;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.grades button small{font-weight:500;color:var(--muted);font-size:12px}
.grades .g0{color:var(--bad)}.grades .g1{color:var(--warn)}.grades .g2{color:var(--good)}.grades .g3{color:var(--accent)}
.grades button:hover{border-color:currentColor}
.prog{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
/* quiz */
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt b{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);flex:none;margin-top:1px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.qedit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line2);padding-top:16px;margin-top:16px}
.oprow{display:flex;align-items:center;gap:10px}
.oprow input[type=radio]{accent-color:var(--accent);width:18px;height:18px;flex:none}
/* notes */
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.nlist{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 180px);overflow:auto;padding:2px}
.nitem{text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%}
.nitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nitem b{font-family:var(--font-display);font-size:15px;overflow-wrap:anywhere}
.nitem span{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool{display:flex;gap:4px;flex-wrap:wrap}
.tool button{min-width:34px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.tool button:hover{border-color:var(--accent)}
.title-in{font-family:var(--font-display);font-size:26px;font-weight:700;border:0!important;padding:4px 0!important;background:none!important;outline:none!important}
.body-in{min-height:52vh;font-size:15.5px;line-height:1.65;border:0;background:var(--surface2);border-radius:12px;padding:16px}
.prose{line-height:1.7;font-size:15.5px;overflow-wrap:anywhere}
.prose h2{margin:20px 0 8px;font-size:23px}.prose h3{margin:18px 0 6px}.prose h4{margin:14px 0 4px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose ul.chk{list-style:none;padding-left:4px;border:0}
.prose ul.chk li::before{content:"\2610";margin-right:8px;color:var(--muted)}
.prose ul.chk li.done::before{content:"\2611";color:var(--good)}
.prose ul.chk li.done{color:var(--muted);text-decoration:line-through}
.prose blockquote{margin:0 0 12px;padding:4px 14px;border-left:3px solid var(--accent);color:var(--muted)}
.prose code{font-family:var(--font-mono);font-size:.88em;background:var(--surface2);padding:1px 6px;border-radius:5px}
/* planner */
.exam{display:flex;align-items:center;gap:14px}
.exam .n{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:1;min-width:52px;text-align:center}
.pri-h{--dc:var(--bad)}.pri-m{--dc:var(--warn)}.pri-l{--dc:var(--muted)}
/* timetable */
.ttw{overflow-x:auto;border:1px solid var(--line2);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.tt{display:grid;grid-template-columns:46px repeat(7,minmax(104px,1fr));min-width:780px}
.tt .hd{padding:10px 8px;text-align:center;font-weight:600;font-size:13px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface)}
.tt .hd.now{color:var(--accent)}
.tt .hd.now small{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.tt .hrs{position:relative}
.tt .hrs span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-family:var(--font-mono)}
.tt .col{position:relative;border-left:1px solid var(--line2)}
.tt .col.now{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.blk{position:absolute;border:0;border-left:3px solid var(--dc);background:color-mix(in srgb,var(--dc) 16%,var(--surface));border-radius:7px;padding:4px 7px;text-align:left;cursor:pointer;overflow:hidden;font-size:12px;line-height:1.3;color:var(--ink)}
.blk b{display:block;font-size:12.5px}
.blk span{color:var(--muted)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
/* library */
.lib{display:flex;gap:14px;align-items:flex-start}
.lib .ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.lib h3{overflow-wrap:anywhere}
/* progress */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:4px}
.heat i{border-radius:3px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}.heat i.l4{background:var(--heat4)}
.heat i.fut{background:none}
.scroll-x{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
svg .gl{stroke:var(--line2);stroke-width:1}
svg .bar-f{fill:var(--accent)}svg .bar-t{fill:var(--c1)}
/* focus */
.timer{display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 18px}
.dial{position:relative;width:260px;height:260px;max-width:100%}
.dial svg{transform:rotate(-90deg);width:100%;height:100%}
.dial .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .t b{font-family:var(--font-mono);font-size:52px;font-weight:500}
/* modal */
.mback{position:fixed;inset:0;background:rgba(8,12,22,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px}
.modal.wide{width:min(760px,100%)}
.modal>header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;background:var(--dc);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2.5px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.days{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- spaced repetition (SM-2 style) ---------- */
function nextInt(c,g){
  if(g===0)return 0;
  let i;
  if(c.reps===0)i=g===1?1:g===2?1:3;
  else if(c.reps===1)i=g===1?3:g===2?6:9;
  else{const b=c.int||1;i=g===1?b*1.2:g===2?b*c.ease:b*c.ease*1.3;i=Math.max(b+1,Math.round(i));}
  return Math.round(i);
}
function schedule(c,g){
  c.seen=true;c.last=dn();
  if(g===0){c.lapses=(c.lapses||0)+1;c.reps=0;c.int=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=dn();return;}
  const ni=nextInt(c,g);
  if(g===1)c.ease=Math.max(1.3,c.ease-0.15);
  if(g===3)c.ease=Math.min(3,c.ease+0.15);
  c.int=ni;c.reps++;c.due=dn()+ni;
}
function fmtInt(d,g){
  if(g===0)return 'soon';

}

function buildQueue(decks,cram){
  const t=dn(),out=[];
  if(cram){decks.forEach(d=>d.cards.forEach(c=>out.push({d:d.id,c:c.id,card:c})));return shuffle(out);}
  let left=Math.max(0,S.settings.newPerDay-(logRead(t).newSeen||0));
  const nw=[];
  decks.forEach(d=>d.cards.forEach(c=>{
    if(c.seen&&c.due<=t)out.push({d:d.id,c:c.id,card:c});
    else if(!c.seen)nw.push({d:d.id,c:c.id,card:c});
  }));
  out.sort((a,b)=>a.card.due-b.card.due);
  return out.concat(nw.slice(0,left));
}

}

}

/* ---------- markdown ---------- */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/==([^=]+)==/g,'<mark>$1</mark>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(src){
  const lines=esc(src).split('\n');let out='',list=null,para=[];
  const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[];}};
  const close=()=>{if(list){out+='</'+list+'>';list=null;}};
  for(const raw of lines){
    const l=raw.trimEnd();let m;
    if(!l.trim()){flush();close();continue;}
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){flush();close();const n=m[1].length+1;out+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';continue;}
    if((m=l.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)$/i))){flush();if(list!=='ul'){close();out+='<ul class="chk">';list='ul';}out+='<li class="'+(m[1].toLowerCase()==='x'?'done':'')+'">'+inline(m[2])+'</li>';continue;}
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){flush();if(list!=='ul'){close();out+='<ul>';list='ul';}out+='<li>'+inline(m[1])+'</li>';continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){flush();if(list!=='ol'){close();out+='<ol>';list='ol';}out+='<li>'+inline(m[1])+'</li>';continue;}
    if((m=l.match(/^&gt;\s?(.*)$/))){flush();close();out+='<blockquote>'+inline(m[1])+'</blockquote>';continue;}
    close();para.push(l);
  }
  flush();close();return out;
}

function dueLabel(s){
  const n=pd(s)-dn();
  if(n<0)return {t:plural(-n,'day')+' overdue',c:'bad'};
  if(n===0)return {t:'Today',c:'warn'};
  if(n===1)return {t:'Tomorrow',c:'acc'};
  if(n<7)return {t:fmtD(pd(s),{day:undefined,month:undefined}),c:''};
  return {t:fmtD(pd(s)),c:''};
}
const byDue=(a,b)=>a.due.localeCompare(b.due);
const findDeck=id=>S.decks.find(d=>d.id===id);

/* ---------- Today ---------- */

  const hello=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';

  const lg=logRead(t),goal=Math.max(1,S.settings.goal),pct=Math.min(1,lg.reviews/goal);

    '<div class="row tight"><button class="btn" data-a="newNote">'+ic('plus',16)+'Note</button><button class="btn" data-a="newTask">'+ic('plus',16)+'Task</button><button class="btn" data-a="nav" data-r="focus">'+ic('timer',16)+'Focus</button></div></div>'+sample+
  '<div class="hero">'+
    '<div class="cta"><div><div class="small" style="opacity:.85">Ready to review</div><div class="big">'+q.length+'</div><div style="opacity:.9;margin-top:4px">'+plural(dueN,'card')+' due · '+newN+' new</div></div>'+
      (q.length?'<button class="btn" data-a="study" data-id="all">'+ic('bolt',16)+'Start review</button>':'<span style="opacity:.9">All caught up. Nice work.</span>')+'</div>'+
    '<div class="card row" style="flex-wrap:nowrap;gap:16px"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="var(--line2)" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(pct*C).toFixed(1)+' '+C.toFixed(1)+'"/></svg><b>'+Math.round(pct*100)+'%</b></div>'+
      '<div class="stat"><b>'+lg.reviews+'<span style="font-size:15px;color:var(--muted);font-family:var(--font-body)"> / '+goal+'</span></b><span>cards reviewed today</span></div></div>'+
    '<div class="card stat" style="justify-content:center"><div class="row tight" style="color:var(--c2)">'+ic('flame',22)+'</div><b>'+streak()+'</b><span>day streak · '+(lg.minutes||0)+' min focused today</span></div>'+
  '</div>'+
  '<div class="grid two sec">'+
    '<div class="card"><div class="row sp"><h3>Up next</h3><button class="btn ghost sm" data-a="nav" data-r="plan">All tasks</button></div><div class="list" style="margin-top:6px">'+
      (open.length?open.map(taskRow).join(''):'<p class="muted" style="padding:14px 0">Nothing open. Add a task to plan your week.</p>')+'</div></div>'+
    '<div class="stack">'+
      (exams.length?exams.map(x=>{const n=pd(x.due)-t;return '<div class="card exam"><div class="n">'+n+'</div><div><h3>'+esc(x.title)+'</h3><span class="muted small">'+(n===1?'day':'days')+' to go · '+fmtD(pd(x.due))+'</span></div></div>';}).join(''):'')+
      '<div class="card"><div class="row sp"><h3>Today’s timetable</h3><button class="btn ghost sm" data-a="nav" data-r="week">Week</button></div><div class="list" style="margin-top:6px">'+
      (todays.length?todays.map(b=>'<div class="li"><span class="dot" style="--dc:'+dcol(b.color)+'"></span><div class="grow"><b>'+esc(b.title)+'</b><div class="muted small">'+esc(b.room||'')+'</div></div><span class="mono small muted">'+b.start+'–'+b.end+'</span></div>').join(''):'<p class="muted" style="padding:14px 0">No classes today.</p>')+'</div></div>'+
    '</div></div>';
}

   '<div class="row tight"><button class="btn" data-a="newDeck">'+ic('plus',16)+'New deck</button>'+(q.length?'<button class="btn pri" data-a="study" data-id="all">'+ic('bolt',16)+'Review '+q.length+' due</button>':'')+'</div></div>'+
   (S.decks.length?'<div class="grid">'+S.decks.map(deckCard).join('')+'</div>':emptyBox('No decks yet','Create a deck, add a few cards, then review them daily.','<button class="btn pri" data-a="newDeck">Create your first deck</button>'));

   '<div class="bar" title="New / learning / mature"><i style="width:'+(c.n/tot*100)+'%;background:var(--line)"></i><i style="width:'+(c.l/tot*100)+'%;background:var(--warn)"></i><i style="width:'+(c.m/tot*100)+'%;background:var(--good)"></i></div>'+
   '<div class="row tight"><button class="btn pri sm" data-a="study" data-id="'+d.id+'"'+(q?'':' disabled')+'>Study</button><button class="btn sm" data-a="cram" data-id="'+d.id+'"'+(c.total?'':' disabled')+'>Cram all</button><button class="btn sm" data-a="openDeck" data-id="'+d.id+'">Cards</button></div></div>';

function vReview(){
  const r=ui.review;
  if(r.done||r.i>=r.queue.length){
    const n=r.stats.reduce((a,b)=>a+b,0),good=r.stats[2]+r.stats[3];
    return '<div class="stage" style="padding-top:30px"><div class="card stack" style="text-align:center;align-items:center;padding:34px 22px"><h1><span class="hl">Session done</span></h1><p class="muted">'+(r.cram?'Cram mode does not change your schedule.':'Your schedule is updated.')+'</p>'+
     '<div class="row" style="gap:28px;justify-content:center"><div class="stat"><b>'+n+'</b><span>graded</span></div><div class="stat"><b>'+(n?Math.round(good/n*100):0)+'%</b><span>remembered</span></div><div class="stat"><b>'+r.stats[0]+'</b><span>to retry</span></div></div>'+
     '<div class="row tight"><button class="btn pri" data-a="exitReview">Back to decks</button></div></div></div>';
  }
  const e=r.queue[r.i],d=findDeck(e.d),c=d&&d.cards.find(x=>x.id===e.c);
  if(!c){r.i++;return vReview();}
  const pr=Math.round(r.i/r.queue.length*100);
  const lab=['Again','Hard','Good','Easy'];
  return '<div class="stage"><div class="row sp"><button class="btn ghost sm" data-a="exitReview">'+ic('x',16)+'End session</button><span class="mono small muted">'+(r.i+1)+' / '+r.queue.length+(r.cram?' · cram':'')+'</span></div>'+
   '<div class="prog" role="progressbar" aria-valuenow="'+pr+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pr+'%"></i></div>'+
   '<div class="flip'+(r.flipped&&!r.anim?' on':'')+'" style="--dc:'+dcol(d.color)+'"><div class="inner" data-a="flip" role="button" tabindex="0" aria-label="Flip card">'+
     '<div class="face"><span class="tag">'+esc(d.name)+(c.seen?'':' · new')+'</span><div class="txt">'+lines2(c.q)+'</div>'+(r.hint&&c.hint?'<div class="muted small" style="margin-top:14px;background:var(--surface);padding:2px 8px;border-radius:6px">Hint: '+esc(c.hint)+'</div>':'')+'</div>'+
     '<div class="face back"><span class="tag">Answer</span><div class="txt">'+lines2(c.a)+'</div></div></div></div>'+
   (r.flipped?
     '<div class="grades">'+lab.map((l,g)=>'<button class="g'+g+'" data-a="grade" data-g="'+g+'">'+l+'<small>'+(r.cram?'—':fmtInt(nextInt(c,g),g))+'</small></button>').join('')+'</div><p class="xs muted" style="text-align:center">Keys <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> <span class="kbd">4</span></p>':
     '<div class="row" style="justify-content:center"><button class="btn pri" data-a="flip" style="min-width:180px">Show answer</button>'+(c.hint&&!r.hint?'<button class="btn" data-a="hint">Hint</button>':'')+'</div><p class="xs muted" style="text-align:center">Press <span class="kbd">Space</span> to flip</p>')+
   '</div>';
}

/* ---------- Timetable ---------- */
function lanes(list){
  const ev=list.slice().sort((a,b)=>tm(a.start)-tm(b.start)||tm(a.end)-tm(b.end));
  const out=[];let cl=[],cend=-1,ends=[];
  const closeC=()=>{cl.forEach(x=>{x.n=ends.length;});out.push.apply(out,cl);cl=[];ends=[];cend=-1;};
  ev.forEach(b=>{
    const s=tm(b.start),e=tm(b.end);
    if(cl.length&&s>=cend)closeC();
    let l=ends.findIndex(x=>x<=s);
    if(l<0){l=ends.length;ends.push(e);}else ends[l]=e;
    cend=Math.max(cend,e);cl.push({b:b,l:l,n:1});
  });
  closeC();return out;
}
function vWeek(){
  const t=dn(),today=wd(t),PX=46;
  let h0=7,h1=18;
  S.tt.forEach(b=>{h0=Math.min(h0,Math.floor(tm(b.start)/60));h1=Math.max(h1,Math.ceil(tm(b.end)/60));});
  const H=(h1-h0)*PX,now=new Date(),nm=now.getHours()*60+now.getMinutes();
  let hrs='';for(let h=h0;h<=h1;h++)hrs+='<span style="top:'+((h-h0)*PX)+'px">'+String(h).padStart(2,'0')+':00</span>';
  let cols='';
  for(let d=0;d<7;d++){
    const bl=lanes(S.tt.filter(b=>b.day===d)).map(x=>{
      const b=x.b,top=(tm(b.start)-h0*60)/60*PX,hh=Math.max(24,(tm(b.end)-tm(b.start))/60*PX-2);
      return '<button class="blk" data-a="editBlock" data-id="'+b.id+'" style="--dc:'+dcol(b.color)+';top:'+top+'px;height:'+hh+'px;left:calc('+(x.l/x.n*100)+'% + 2px);width:calc('+(100/x.n)+'% - 4px)"><b>'+esc(b.title)+'</b><span>'+b.start+'–'+b.end+(b.room?' · '+esc(b.room):'')+'</span></button>';
    }).join('');
    const nl=(d===today&&nm>=h0*60&&nm<=h1*60)?'<div class="nowline" style="top:'+((nm-h0*60)/60*PX)+'px"></div>':'';
    cols+='<div class="col'+(d===today?' now':'')+'" style="height:'+H+'px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent '+(PX-1)+'px,var(--line2) '+(PX-1)+'px,var(--line2) '+PX+'px)">'+bl+nl+'</div>';
  }
  const heads='<div class="hd"></div>'+DAYS.map((n,d)=>'<div class="hd'+(d===today?' now':'')+'">'+n+(d===today?' <small>today</small>':'')+'</div>').join('');
  return '<div class="ph"><div><h1><span class="hl">Timetable</span></h1><p>Your weekly routine. Tap a block to edit it.</p></div><button class="btn pri" data-a="newBlock">'+ic('plus',16)+'Add class or session</button></div>'+
   (S.tt.length?'':emptyBox('Your week is empty','Add classes, lectures and study sessions to see them here and on Today.'))+
   '<div class="ttw" style="margin-top:'+(S.tt.length?0:16)+'px"><div class="tt">'+heads+'<div class="hrs" style="height:'+H+'px">'+hrs+'</div>'+cols+'</div></div>';
}

/* ---------- Progress ---------- */
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(Math.max(5,m))));for(const k of [1,2,2.5,5,10]){if(k*p>=m&&k*p>=5)return k*p;}return 10*p;}
function vProgress(){
  const t=dn(),logs=Object.keys(S.log).map(k=>S.log[k]);
  const tot=logs.reduce((a,l)=>({r:a.r+(l.reviews||0),c:a.c+(l.correct||0),m:a.m+(l.minutes||0),q:a.q+(l.quizzes||0)}),{r:0,c:0,m:0,q:0});
  const att=[];S.quizzes.forEach(z=>z.attempts.forEach(a=>att.push({n:z.name,a:a})));att.sort((x,y)=>y.a.date-x.a.date);
  const avgQ=att.length?Math.round(att.reduce((s,x)=>s+x.a.score/x.a.total,0)/att.length*100):null;
  /* bars: last 14 days */
  const vals=[];for(let i=13;i>=0;i--)vals.push({d:t-i,v:logRead(t-i).reviews||0});
  const mx=niceMax(Math.max.apply(null,vals.map(x=>x.v))),W=620,Hh=190,L=34,B=26,T=10,bw=(W-L)/14;
  let svg='<svg viewBox="0 0 '+W+' '+Hh+'" width="100%" style="min-width:480px" role="img" aria-label="Cards reviewed per day, last 14 days">';
  [0,mx/2,mx].forEach(v=>{const y=T+(Hh-B-T)*(1-v/mx);svg+='<line class="gl" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(Number.isInteger(v)?v:v.toFixed(1))+'</text>';});
  vals.forEach((x,i)=>{
    const h=(Hh-B-T)*(x.v/mx),xx=L+i*bw+bw*0.2,y=Hh-B-h;
    svg+='<rect class="'+(i===13?'bar-t':'bar-f')+'" x="'+xx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.6).toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="3"><title>'+fmtD(x.d)+': '+x.v+' cards</title></rect>';
    svg+='<text x="'+(xx+bw*0.3).toFixed(1)+'" y="'+(Hh-8)+'" text-anchor="middle">'+DAYS[wd(x.d)][0]+'</text>';
  });
  svg+='</svg>';
  /* heatmap */
  const weeks=17,start=t-wd(t)-7*(weeks-1);let heat='';
  for(let i=0;i<weeks*7;i++){
    const d=start+i;if(d>t){heat+='<i class="fut"></i>';continue;}
    const l=logRead(d),sc=(l.reviews||0)+(l.minutes||0)+(l.quizzes||0)*10;
    const lv=sc===0?0:sc<10?1:sc<25?2:sc<50?3:4;
    heat+='<i class="l'+lv+'" title="'+fmtD(d)+': '+(l.reviews||0)+' cards, '+(l.minutes||0)+' min"></i>';
  }
  /* forecast */
  const fc=[];for(let k=0;k<7;k++){let n=0;S.decks.forEach(d=>d.cards.forEach(c=>{if(c.seen&&(k===0?c.due<=t:c.due===t+k))n++;}));fc.push(n);}
  const fm=Math.max(1,Math.max.apply(null,fc));
  return '<div class="ph"><div><h1><span class="hl">Progress</span></h1><p>What you have done, and what is coming up.</p></div></div>'+
   '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+
    [[streak(),'day streak'],[tot.r,'cards reviewed'],[tot.r?Math.round(tot.c/tot.r*100)+'%':'–','accuracy'],[tot.m>=60?(tot.m/60).toFixed(1)+' h':tot.m+' min','focused time'],[avgQ===null?'–':avgQ+'%','quiz average']].map(s=>'<div class="card stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>').join('')+'</div>'+
   '<div class="card sec"><div class="row sp"><h3>Cards reviewed, last 14 days</h3><span class="chip">Goal '+S.settings.goal+' per day</span></div><div class="scroll-x" style="margin-top:12px">'+svg+'</div></div>'+
   '<div class="grid two sec"><div class="card"><h3>Study consistency</h3><p class="muted small" style="margin:4px 0 12px">Last '+weeks+' weeks. Darker means more reviews, minutes and quizzes.</p><div class="scroll-x"><div class="heat">'+heat+'</div></div></div>'+
   '<div class="card"><h3>Reviews due this week</h3><div style="display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:16px">'+fc.map((n,k)=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%"><span class="mono xs">'+n+'</span><div style="width:100%;height:'+Math.max(3,n/fm*72)+'px;background:var(--accent);border-radius:5px;opacity:'+(k===0?1:.65)+'"></div><span class="xs muted">'+(k===0?'Now':DAYS[wd(t+k)])+'</span></div>').join('')+'</div></div></div>'+
   '<div class="sec"><h3 style="margin-bottom:12px">Deck mastery</h3>'+(S.decks.length?'<div class="card stack">'+S.decks.map(d=>{const c=deckCounts(d),tt=Math.max(1,c.total);
     return '<div><div class="row sp"><span class="row tight"><span class="dot" style="--dc:'+dcol(d.color)+'"></span><b>'+esc(d.name)+'</b></span><span class="muted small">'+c.m+' mature · '+c.l+' learning · '+c.n+' new</span></div><div class="bar" style="margin-top:7px;height:10px"><i style="width:'+(c.m/tt*100)+'%;background:var(--good)"></i><i style="width:'+(c.l/tt*100)+'%;background:var(--warn)"></i><i style="width:'+(c.n/tt*100)+'%;background:var(--line)"></i></div></div>';}).join('')+'</div>':emptyBox('No decks','Create a deck to track mastery.'))+'</div>'+
   '<div class="sec"><h3 style="margin-bottom:12px">Recent quizzes</h3>'+(att.length?'<div class="card" style="padding:4px 18px"><div class="list">'+att.slice(0,6).map(x=>{const p=Math.round(x.a.score/x.a.total*100);return '<div class="li"><div class="grow"><b>'+esc(x.n)+'</b><div class="muted small">'+new Date(x.a.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</div></div><span class="chip '+(p>=80?'good':p>=50?'warn':'bad')+'">'+x.a.score+'/'+x.a.total+' · '+p+'%</span></div>';}).join('')+'</div></div>':emptyBox('No quiz attempts yet','Take a quiz and your scores show up here.'))+'</div>';
}

    (sj.length?'<div class="list" style="margin-top:12px">'+sj.map(k=>'<div class="li"><span class="grow">'+esc(k)+'</span><span class="mono small muted">'+subj[k]+' min</span></div>').join('')+'</div>':'')+'</div>'+

let tickT=null;
function paintTimer(){
  const f=ui.focus;if(!f)return;
  const tot=(f.mode==='focus'?S.settings.focus:S.settings.brk)*60000,C=2*Math.PI*116;
  const left=f.running?Math.max(0,f.end-Date.now()):f.left;
  const el=$('#ftime');if(el)el.textContent=fmtClock(left);
  const ring=$('#fring');if(ring)ring.setAttribute('stroke-dashoffset',(C*(1-left/tot)).toFixed(1));
  const m=$('#mini');if(m){m.hidden=!(f.running&&ui.route!=='focus');m.textContent=(f.mode==='focus'?'Focus ':'Break ')+fmtClock(left);}
}
function beep(){
  try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();[0,0.25,0.5].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=i===2?880:660;g.gain.value=0.12;o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+0.18);});}catch(e){}
}
function ensureTick(){
  if(tickT)return;
  tickT=setInterval(()=>{
    const f=ui.focus;if(!f||!f.running)return;
    if(f.end-Date.now()<=0){fDone();return;}
    paintTimer();
  },250);
}
function fDone(){
  const f=ui.focus;f.running=false;beep();
  if(f.mode==='focus'){
    const lg=logFor(dn());lg.minutes=(lg.minutes||0)+S.settings.focus;lg.sessions=(lg.sessions||0)+1;
    const s=f.subject.trim();if(s){lg.subj=lg.subj||{};lg.subj[s]=(lg.subj[s]||0)+S.settings.focus;}
    save('log');toast('Session complete. Take a break.');f.mode='break';f.left=S.settings.brk*60000;
  }else{toast('Break over. Ready when you are.');f.mode='focus';f.left=S.settings.focus*60000;}
  render();
}

function openModal(m){ui.modal=m;$('#modal').innerHTML=modalHtml();setTimeout(()=>{const f=$('#modal input:not([type=hidden]):not([type=radio]):not([type=checkbox]),#modal textarea,#modal select');if(f&&ui.modal&&ui.modal.type!=='more'&&ui.modal.type!=='read'&&ui.modal.type!=='settings')f.focus();},30);}

/* ---------- render ---------- */
const VIEWS={today:vToday,cards:vCards,quiz:vQuiz,notes:vNotes,plan:vPlan,week:vWeek,library:vLibrary,progress:vProgress,focus:vFocus};
function applyTheme(){
  const t=S.settings.theme,r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  const lab=ic('theme',16)+({system:'Theme: auto',light:'Theme: light',dark:'Theme: dark'}[t]||'Theme');
  const b=$('#themeBtn');if(b)b.innerHTML=lab;
  const bm=$('#themeBtnM');if(bm)bm.innerHTML=ic('theme',20);
  const sb=$('#setBtn');if(sb)sb.innerHTML=ic('gear',16)+'Settings';
  const sm=$('#setBtnM');if(sm)sm.innerHTML=ic('gear',20);
}
function render(){
  $('#nav').innerHTML=navHtml();$('#tabs').innerHTML=tabsHtml();
  $('#view').innerHTML=ui.loading?'<div class="empty" style="margin-top:60px"><b>Opening your desk…</b><span>Loading your saved study data.</span></div>':VIEWS[ui.route]();
  if(ui.modal)$('#modal').innerHTML=modalHtml();
  applyTheme();paintSync();paintTimer();
}
function go(r){
  if(!ROUTES.includes(r))r='today';
  if(ui.route!==r){ui.review=null;ui.qz=null;ui.qd=null;ui.deckId=null;}
  ui.route=r;closeModal();
  if(location.hash.slice(1)!==r){try{history.replaceState(null,'','#'+r);}catch(e){location.hash=r;}}
  render();window.scrollTo(0,0);
}

/* ---------- helpers for actions ---------- */
function refocus(id){const el=$('#'+id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
function confirmBox(msg,ok,fn){openModal({type:'confirm',msg:msg,ok:ok,fn:fn});}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard');}
  catch(e){openModal({type:'text',title:'Copy text',note:'Select all and copy.',text:text});}
}
async function saveFile(name,data){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:data});toast('File saved');return;}
  }catch(e){if(e&&e.code==='declined')return;}
  openModal({type:'text',title:name,note:'Saving files is not available in this view. Copy the text and keep it somewhere safe.',text:data});
}
const curNote=()=>S.notes.find(n=>n.id===ui.noteId);
let noteT=null;
function noteInput(){
  const n=curNote();if(!n)return;
  const ti=$('#noteTitle'),tg=$('#noteTag'),bd=$('#noteBody');
  if(ti)n.title=ti.value;if(tg)n.tag=tg.value.trim();if(bd)n.body=bd.value;
  n.updated=Date.now();clearTimeout(noteT);noteT=setTimeout(()=>save('notes'),500);

function mdInsert(kind){
  const ta=$('#noteBody');if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  const wrap={bold:['**','**','bold text'],em:['*','*','emphasis'],hl:['==','==','key idea'],code:['`','`','code']};
  if(wrap[kind]){const w=wrap[kind],body=sel||w[2];ta.setRangeText(w[0]+body+w[1],s,e,'select');ta.setSelectionRange(s+w[0].length,s+w[0].length+body.length);}
  else{const pre={h:'## ',ul:'- ',ol:'1. ',chk:'- [ ] ',q:'> '}[kind];const ls=v.lastIndexOf('\n',s-1)+1;ta.setRangeText(pre,ls,ls,'preserve');ta.setSelectionRange(s+pre.length,e+pre.length);}
  ta.focus();noteInput();
}
function gradeCard(g){
  const r=ui.review;if(!r||!r.flipped||r.done)return;
  const e=r.queue[r.i],d=findDeck(e.d),c=d&&d.cards.find(x=>x.id===e.c);
  if(c&&!r.cram){
    const wasNew=!c.seen;schedule(c,g);
    const lg=logFor(dn());lg.reviews++;if(g>0)lg.correct++;if(wasNew)lg.newSeen=(lg.newSeen||0)+1;
    save('decks');save('log');
  }
  r.stats[g]++;
  if(g===0)r.queue.splice(Math.min(r.i+4,r.queue.length),0,e);
  r.i++;r.flipped=false;r.hint=false;r.anim=false;
  if(r.i>=r.queue.length)r.done=true;
  render();
}
function flipCard(){
  const r=ui.review;if(!r||r.done)return;
  if(r.flipped){r.flipped=false;r.anim=false;render();return;}
  r.flipped=true;r.anim=true;render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{r.anim=false;const f=$('.flip');if(f)f.classList.add('on');}));
}
function startReview(decks,cram){
  const q=buildQueue(decks,cram);
  if(!q.length){toast('Nothing due right now.');return;}
  go('cards');
  ui.review={queue:q,i:0,flipped:false,hint:false,anim:false,stats:[0,0,0,0],cram:!!cram,done:false};
  render();window.scrollTo(0,0);
}
const blankQ=()=>({q:'',o:['','','',''],ans:0,expl:''});
function startQuizRun(z,qs,retry){
  go('quiz');
  ui.qz={id:z.id,qs:qs,i:0,picked:null,score:0,missed:[],done:false,retry:!!retry};
  render();
}
const shuffledQs=z=>shuffle(z.questions).map(q=>({q:q.q,expl:q.expl,opts:shuffle(q.opts.map((t,j)=>({t:t,ok:j===q.ans})))}));

      const opts=[];let ans=-1;
      q.o.forEach((t,j)=>{if(t.trim()){if(j===q.ans)ans=opts.length;opts.push(t.trim());}});
      if(opts.length<2){toast('Question '+(i+1)+' needs at least two answers.');return;}
      if(ans<0){toast('Question '+(i+1)+': mark a filled-in answer as correct.');return;}

  newExam(){openModal({type:'task',kind:'exam'});},
  editTask(el){openModal({type:'task',id:el.dataset.id});},
  toggleTask(el){const x=S.tasks.find(t=>t.id===el.dataset.id);x.done=!x.done;save('tasks');render();},
  delTask(el){const id=el.dataset.id;closeModal();confirmBox('Delete this task?','Delete',()=>{S.tasks=S.tasks.filter(t=>t.id!==id);save('tasks');render();});},
  planF(el){ui.planF=el.dataset.f;render();},
  /* timetable */
  newBlock(){openModal({type:'block'});},
  editBlock(el){openModal({type:'block',id:el.dataset.id});},
  delBlock(el){const id=el.dataset.id;closeModal();confirmBox('Remove this block from your timetable?','Remove',()=>{S.tt=S.tt.filter(b=>b.id!==id);save('tt');render();});},
  /* library */
  newLink(){openModal({type:'link'});},
  newDoc(){openModal({type:'doc'});},
  editLib(el){const x=S.lib.find(y=>y.id===el.dataset.id);openModal({type:x.kind==='link'?'link':'doc',id:x.id});},
  readDoc(el){openModal({type:'read',id:el.dataset.id});},
  delLib(el){const x=S.lib.find(y=>y.id===el.dataset.id);confirmBox('Delete "'+x.title+'"?','Delete',()=>{S.lib=S.lib.filter(y=>y.id!==x.id);save('lib');render();});},
  libF(el){ui.libF=el.dataset.f;render();},
  copyDoc(el){const x=S.lib.find(y=>y.id===el.dataset.id);copyText(x.body);},
  dlDoc(el){const x=S.lib.find(y=>y.id===el.dataset.id);saveFile((x.title.replace(/[^\w\- ]+/g,'').trim()||'document')+'.md',x.body);},
  copyTxt(){const t=$('#txtOut');if(t){t.select();try{document.execCommand('copy');toast('Copied');}catch(e){}}},
  /* focus */
  fToggle(){
    const f=fState();
    if(f.running){f.left=Math.max(0,f.end-Date.now());f.running=false;}
    else{if(f.left<=0)f.left=(f.mode==='focus'?S.settings.focus:S.settings.brk)*60000;f.end=Date.now()+f.left;f.running=true;ensureTick();}
    render();
  },
  fReset(){const f=fState();f.running=false;f.left=(f.mode==='focus'?S.settings.focus:S.settings.brk)*60000;render();},
  fSkip(){const f=fState();f.mode=f.mode==='focus'?'break':'focus';f.running=false;f.left=(f.mode==='focus'?S.settings.focus:S.settings.brk)*60000;render();},
  fMode(el){const f=fState();f.mode=el.dataset.m;f.running=false;f.left=(f.mode==='focus'?S.settings.focus:S.settings.brk)*60000;render();},
  /* data */
  exportAll(){saveFile('margin-backup-'+ymd(dn())+'.json',JSON.stringify({app:'margin-study',v:1,data:S},null,1));},
  resetAll(){closeModal();confirmBox('Erase every deck, note, task and score? Export a backup first if you might want it back.','Erase everything',()=>{S=defaults();ui.review=null;ui.qd=null;ui.qz=null;ui.noteId=null;ui.deckId=null;saveAll();render();toast('Desk cleared');});}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.tagName==='A')return;
  fn(el,e);
});

/* ---------- forms ---------- */
const parseCards=txt=>txt.split('\n').map(l=>{
  let p=null;
  if(l.indexOf('::')>-1)p=l.split('::');else if(l.indexOf('\t')>-1)p=l.split('\t');else if(l.indexOf(';')>-1)p=l.split(';');
  if(!p)return null;const q=p[0].trim(),a=p.slice(1).join(' ').trim();return q&&a?{q:q,a:a}:null;
}).filter(Boolean);
const newCard=(q,a,h)=>({id:uid(),q:q,a:a,hint:h||'',ease:2.5,int:0,reps:0,lapses:0,due:dn(),seen:false,last:null});
const FORMS={
  deck(fd,f){
    const name=String(fd.get('name')).trim();if(!name)return;const id=f.dataset.id;
    if(id){const d=findDeck(id);d.name=name;d.color=+fd.get('color');}
    else{const d={id:uid(),name:name,color:+fd.get('color'),cards:[]};S.decks.push(d);ui.deckId=d.id;ui.cardQ='';}
    save('decks');closeModal();render();
  },
  addcard(fd,f){
    const d=findDeck(f.dataset.id);d.cards.push(newCard(String(fd.get('q')).trim(),String(fd.get('a')).trim(),String(fd.get('hint')).trim()));
    save('decks');render();toast('Card added');const t=$('#cf');if(t)t.focus();
  },
  card(fd,f){S.decks.forEach(d=>d.cards.forEach(c=>{if(c.id===f.dataset.id){c.q=String(fd.get('q')).trim();c.a=String(fd.get('a')).trim();c.hint=String(fd.get('hint')).trim();}}));save('decks');closeModal();render();},
  import(fd,f){
    const l=parseCards(String(fd.get('t')));if(!l.length){toast('No lines with a separator found.');return;}
    const d=findDeck(f.dataset.id);l.forEach(x=>d.cards.push(newCard(x.q,x.a)));save('decks');closeModal();render();toast(plural(l.length,'card')+' imported');
  },
  genquiz(fd){
    const d=findDeck(String(fd.get('deck'))),n=+fd.get('n');if(!d)return;
    const cards=shuffle(d.cards),qs=[];
    for(let k=0;k<cards.length&&qs.length<n;k++){
      const c=cards[k],ans=c.a.slice(0,140);
      const pool=Array.from(new Set(d.cards.filter(x=>x.id!==c.id).map(x=>x.a.slice(0,140)))).filter(x=>x!==ans);
      if(pool.length<3)continue;
      qs.push({q:c.q,opts:[ans].concat(shuffle(pool).slice(0,3)),ans:0,expl:'Answer on the card: '+c.a.slice(0,200)});
    }
    if(!qs.length){toast('Could not build questions. Add more distinct cards.');return;}
    const z={id:uid(),name:d.name+' quiz',attempts:[],questions:qs};
    S.quizzes.push(z);save('quizzes');closeModal();startQuizRun(z,shuffledQs(z),false);
  },
  task(fd,f){
    const o={title:String(fd.get('title')).trim(),subject:String(fd.get('subject')).trim(),due:String(fd.get('due')),pri:String(fd.get('pri')),type:String(fd.get('type'))};
    if(!o.title||!o.due)return;
    if(f.dataset.id){Object.assign(S.tasks.find(t=>t.id===f.dataset.id),o);}
    else S.tasks.push(Object.assign({id:uid(),done:false},o));
    save('tasks');closeModal();render();
  },
  block(fd,f){
    const start=String(fd.get('start')),end=String(fd.get('end')),title=String(fd.get('title')).trim();
    if(tm(end)<=tm(start)){toast('End time must be after start time.');return;}
    const days=fd.getAll('day').map(Number);if(!days.length){toast('Pick at least one day.');return;}
    const o={title:title,start:start,end:end,room:String(fd.get('room')).trim(),color:+fd.get('color')};
    if(f.dataset.id){Object.assign(S.tt.find(b=>b.id===f.dataset.id),o,{day:days[0]});}
    else days.forEach(d=>S.tt.push(Object.assign({id:uid(),day:d},o)));
    save('tt');closeModal();render();
  },
  link(fd,f){
    let url=String(fd.get('url')).trim();if(!/^https?:\/\//i.test(url))url='https://'+url;
    const o={url:url,title:String(fd.get('title')).trim()||host(url),tag:String(fd.get('tag')).trim()};
    if(f.dataset.id)Object.assign(S.lib.find(x=>x.id===f.dataset.id),o);else S.lib.push(Object.assign({id:uid(),kind:'link',added:Date.now()},o));
    save('lib');closeModal();render();toast('Link saved');
  },
  doc(fd,f){
    const o={title:String(fd.get('title')).trim(),tag:String(fd.get('tag')).trim(),body:String(fd.get('body'))};
    if(f.dataset.id)Object.assign(S.lib.find(x=>x.id===f.dataset.id),o);else S.lib.push(Object.assign({id:uid(),kind:'doc',added:Date.now()},o));
    save('lib');closeModal();render();toast('Document saved');
  },
  logtime(fd){
    const m=Math.max(1,Math.min(600,+fd.get('m')||0)),s=String(fd.get('s')).trim();
    const lg=logFor(dn());lg.minutes=(lg.minutes||0)+m;if(s){lg.subj=lg.subj||{};lg.subj[s]=(lg.subj[s]||0)+m;}
    save('log');render();toast(m+' minutes added');
  },
  settings(fd){
    const n=(k,lo,hi,def)=>Math.max(lo,Math.min(hi,Math.round(+fd.get(k))||def));
    const s=S.settings;
    s.name=String(fd.get('name')).trim();s.goal=n('goal',1,500,20);s.newPerDay=n('newPerDay',0,200,10);s.focus=n('focus',1,120,25);s.brk=n('brk',1,60,5);s.theme=String(fd.get('theme'));
    const f=ui.focus;if(f&&!f.running)f.left=(f.mode==='focus'?s.focus:s.brk)*60000;
    save('settings');closeModal();render();toast('Settings saved');
  }
};
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-f]');if(!f)return;
  e.preventDefault();const fn=FORMS[f.dataset.f];if(fn)fn(new FormData(f),f);
});

/* ---------- inputs, files, keys ---------- */
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='noteTitle'||id==='noteTag'||id==='noteBody')noteInput();
  else if(id==='noteQ'){ui.noteQ=t.value;const l=$('#noteList');if(l)l.innerHTML=noteListHtml();}
  else if(id==='cardQ'){ui.cardQ=t.value;render();refocus('cardQ');}
  else if(id==='libQ'){ui.libQ=t.value;render();refocus('libQ');}
  else if(id==='fsubj'){fState().subject=t.value;}
  else if(t.dataset&&t.dataset.qf&&ui.qd){
    const f=t.dataset.qf,i=+t.dataset.qi;
    if(f==='name')ui.qd.name=t.value;
    else if(f==='q')ui.qd.questions[i].q=t.value;
    else if(f==='expl')ui.qd.questions[i].expl=t.value;
    else if(f[0]==='o')ui.qd.questions[i].o[+f[1]]=t.value;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.qf==='ans'&&ui.qd)ui.qd.questions[+t.dataset.qi].ans=+t.value;
  else if(t.id==='docFile'&&t.files&&t.files[0]){
    const file=t.files[0];
    if(file.size>400000){toast('That file is too large. Keep documents under 400 KB.');return;}
    const r=new FileReader();
    r.onload=()=>{const b=$('#docBody');if(b)b.value=String(r.result);const ti=$('#modal input[name=title]');if(ti&&!ti.value)ti.value=file.name.replace(/\.[^.]+$/,'');};
    r.readAsText(file);
  }
  else if(t.id==='impFile'&&t.files&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(String(r.result));const data=o&&o.data?o.data:o;let n=0;
        KEYS.forEach(k=>{if(data[k]!==undefined&&((k==='settings'||k==='log')?(typeof data[k]==='object'&&!Array.isArray(data[k])):Array.isArray(data[k]))){S[k]=data[k];n++;}});
        if(!n)throw new Error('empty');
        fixShape();saveAll();closeModal();ui.deckId=null;ui.review=null;ui.noteId=null;render();toast('Backup restored');
      }catch(err){toast('That file is not a Margin backup.');}
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal){closeModal();return;}
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  const r=ui.review;
  if(ui.route==='cards'&&r&&!r.done&&!ui.modal){
    if(r.flipped&&'1234'.indexOf(e.key)>-1&&e.key.length===1){gradeCard(+e.key-1);e.preventDefault();return;}
    if((e.key===' '||e.key==='Enter')&&tag!=='button'){flipCard();e.preventDefault();}
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ROUTES.includes(h)&&h!==ui.route)go(h);});

/* ---------- boot and account sync ---------- */
async function connect(had){
  const timer=setTimeout(()=>{if(ui.loading){ui.loading=false;render();}},4000);
  try{
    if(window.claude&&window.claude.use){
      const db=await window.claude.use('db'),user=await window.claude.use('user');
      const id=db&&user?await user.id():null;
      if(db&&id){
        DB=db;UID=id;const push=[];
        for(const k of KEYS){
          const snap=await DB.doc(dpath(k)).get();
          if(snap.exists){
            const d=snap.data()||{},rts=+d.ts||0;
            if(rts>(meta[k]||0)){
              try{let s='';for(let i=0;i<(d.n||0);i++)s+=d['p'+i]||'';S[k]=JSON.parse(s);meta[k]=rts;lsSet(k,{ts:rts,v:S[k]});}catch(e){push.push(k);}
            }else if(rts<(meta[k]||0))push.push(k);
          }else push.push(k);
        }
        fixShape();
        push.forEach(k=>{if(!meta[k]){meta[k]=Date.now();lsSet(k,{ts:meta[k],v:S[k]});}dbPut(k,meta[k]);});
        ui.sync='cloud';
      }
    }
  }catch(e){ui.sync=DB?'error':'local';}
  clearTimeout(timer);
  if(!had&&!DB)saveAll();
  ui.loading=false;fixShape();render();
}
function boot(){
  let had=false;
  KEYS.forEach(k=>{const l=lsGet(k);if(l&&l.v!==undefined&&l.v!==null){S[k]=l.v;meta[k]=l.ts;had=true;}});
  if(!had){seed();ui.loading=!!(window.claude&&window.claude.use);}
  fixShape();
  const h=location.hash.slice(1);ui.route=ROUTES.includes(h)?h:'today';
  render();connect(had);
  setInterval(()=>{if((ui.route==='week'||ui.route==='today')&&!ui.modal&&!ui.loading&&!ui.review)render();},60000);
}
boot();
})();
